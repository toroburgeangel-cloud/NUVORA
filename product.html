<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>商品详情 — NUVORA</title><link rel="stylesheet" href="style.css"><style>
.detail{padding:55px 0 100px}.back{display:inline-block;color:#666;text-decoration:none;margin-bottom:28px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:start}.gallery-main{background:#e9e5dc;border-radius:18px;overflow:hidden;aspect-ratio:1/1;display:grid;place-items:center}.gallery-main img{width:100%;height:100%;object-fit:cover}.gallery-main span{font-size:40px;font-weight:800;letter-spacing:.2em}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.thumb{width:78px;height:78px;border:2px solid transparent;border-radius:10px;overflow:hidden;padding:0;cursor:pointer;background:#eee}.thumb.active{border-color:#171717}.thumb img{width:100%;height:100%;object-fit:cover}.detail-category{color:#888;letter-spacing:.12em;font-size:12px}.detail h1{font-size:clamp(38px,5vw,64px);margin:12px 0}.detail-price{font-size:28px;font-weight:700;margin:25px 0}.detail-description{color:#666;font-size:18px;line-height:1.9;white-space:pre-line}.detail-contact{margin-top:30px}@media(max-width:700px){.detail-grid{grid-template-columns:1fr;gap:30px}}
</style></head><body><header class="header"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NUVORA</span></a><nav><a href="index.html#products">返回商品</a></nav></div></header><main class="detail wrap"><a class="back" href="index.html#products">← 返回商品列表</a><div id="content">正在加载商品…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const content=document.getElementById('content');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){content.innerHTML='<p>没有找到这个商品。</p>';return;}const {data:p,error}=await supabaseClient.from('products').select('*').eq('id',id).eq('published',true).single();if(error||!p){content.innerHTML='<p>商品不存在，或暂时未发布。</p>';return;}const images=(p.image_url||'').split(',').map(x=>x.trim()).filter(Boolean);content.innerHTML=`<div class="detail-grid"><div><div class="gallery-main" id="main-image">${images.length?`<img src="${esc(images[0])}" alt="${esc(p.name)}">`:'<span>NUVORA</span>'}</div><div class="thumbs">${images.map((src,i)=>`<button class="thumb ${i===0?'active':''}" data-src="${esc(src)}"><img src="${esc(src)}" alt="图片${i+1}"></button>`).join('')}</div></div><div><div class="detail-category">${esc(p.category||'商品')}</div><h1>${esc(p.name||'')}</h1><div class="detail-price">€${Number(p.price||0).toFixed(2)}</div><div class="detail-description">${esc(p.description||'暂无商品介绍')}</div><div class="detail-contact"><a class="button" href="https://wa.me/34000000000">咨询购买 →</a></div></div></div>`;document.querySelectorAll('.thumb').forEach(btn=>btn.onclick=()=>{document.querySelector('#main-image img').src=btn.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active');});}load();
</script></body></html>
