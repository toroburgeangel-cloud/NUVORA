<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NUVORA — 后台管理</title><link rel="stylesheet" href="style.css"><style>.admin-wrap{max-width:980px;margin:0 auto;padding:48px 20px}.admin-card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;margin-bottom:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field input,.field textarea{font:inherit;padding:12px 14px;border:1px solid #ccc;border-radius:10px}.field textarea{min-height:110px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.products-admin{display:grid;gap:12px}.admin-product{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid #ddd;border-radius:12px}.admin-product-info{flex:1}.admin-product-info h3{margin:0 0 5px}.admin-product-info p{margin:0;font-size:14px;color:#666}.small-button{border:1px solid #ccc;background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.danger{color:#b00020}.message{margin-top:12px}.hidden{display:none!important}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.admin-product{align-items:flex-start;flex-wrap:wrap}}</style></head><body><header class="header"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NUVORA</span></a><nav><a href="index.html">返回网站</a></nav></div></header><main class="admin-wrap"><section id="login-card" class="admin-card"><p class="eyebrow">NUVORA · ADMIN</p><h1>后台登录</h1><p>只有已创建的管理员账号可以登录。</p><div class="form-grid"><label class="field"><span>邮箱</span><input id="email" type="email"></label><label class="field"><span>密码</span><input id="password" type="password"></label></div><div class="actions"><button class="button" id="login-btn">登录</button></div><p class="message" id="login-msg"></p></section><section id="dashboard" class="hidden"><div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center"><div><p class="eyebrow">PRODUCT MANAGER</p><h1>商品管理</h1></div><button class="small-button" id="logout-btn">退出登录</button></div></div><div class="admin-card"><h2 id="form-title">添加商品</h2><input id="edit-id" type="hidden"><div class="form-grid"><label class="field"><span>商品名称</span><input id="name" type="text" placeholder="例如：厨房清洁剂"></label><label class="field"><span>价格 (€)</span><input id="price" type="number" step="0.01" min="0" placeholder="19.90"></label><label class="field"><span>分类</span><input id="category" type="text" placeholder="新品 / 推荐 / 精选"></label><label class="field"><span>商品图片（可多选）</span><input id="image" type="file" accept="image/*" multiple><small>按住 Command 键可以选择多张图片</small></label><label class="field full"><span>商品介绍</span><textarea id="description" placeholder="写商品的简单介绍"></textarea></label></div><div class="actions"><button class="button" id="save-btn">保存商品</button><button class="small-button hidden" id="cancel-btn">取消编辑</button></div><p class="message" id="save-msg"></p></div><div class="admin-card"><h2>已有商品</h2><div id="admin-products" class="products-admin">正在加载…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let currentProducts=[];function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function publicImage(path){return supabaseClient.storage.from('产品图片').getPublicUrl(path).data.publicUrl;}async function refresh(){const {data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(error){$('admin-products').textContent='加载失败：'+error.message;return;}currentProducts=data||[];$('admin-products').innerHTML=currentProducts.length?currentProducts.map(p=>`<div class="admin-product"><div class="admin-product-info"><h3>${esc(p.name)} · €${Number(p.price||0).toFixed(2)}</h3><p>${esc(p.category||'')} · ${p.published?'已发布':'草稿'}</p><p>${esc(p.description||'')}</p></div><button class="small-button" onclick="editProduct('${p.id}')">编辑</button><button class="small-button" onclick="togglePublished('${p.id}',${!p.published})">${p.published?'下架':'发布'}</button><button class="small-button danger" onclick="deleteProduct('${p.id}')">删除</button></div>`).join(''):'目前没有商品。';}window.editProduct=id=>{const p=currentProducts.find(x=>String(x.id)===String(id));if(!p)return;$('edit-id').value=p.id;$('name').value=p.name||'';$('price').value=p.price||'';$('category').value=p.category||'';$('description').value=p.description||'';$('form-title').textContent='编辑商品';$('cancel-btn').classList.remove('hidden');scrollTo(0,0);};function resetForm(){$('edit-id').value='';$('name').value='';$('price').value='';$('category').value='';$('description').value='';$('image').value='';$('form-title').textContent='添加商品';$('cancel-btn').classList.add('hidden');}$('cancel-btn').onclick=resetForm;$('login-btn').onclick=async()=>{const {error}=await supabaseClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('login-msg').textContent=error?'登录失败：'+error.message:'';if(!error)showDashboard();};$('logout-btn').onclick=async()=>{await supabaseClient.auth.signOut();showLogin();};async function showDashboard(){$('login-card').classList.add('hidden');$('dashboard').classList.remove('hidden');await refresh();}function showLogin(){$('login-card').classList.remove('hidden');$('dashboard').classList.add('hidden');}supabaseClient.auth.getSession().then(({data})=>data.session?showDashboard():showLogin());$('save-btn').onclick=async()=>{ $('save-msg').textContent='正在保存…';const id=$('edit-id').value;const files=[...$('image').files];let urls=[];for(const file of files){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${Date.now()}-${Math.random().toString(36).slice(2)}-${safe}`;const up=await supabaseClient.storage.from('产品图片').upload(path,file,{upsert:false});if(up.error){$('save-msg').textContent='图片上传失败：'+up.error.message;return;}urls.push(publicImage(path));}const payload={name:$('name').value.trim(),price:Number($('price').value),category:$('category').value.trim(),description:$('description').value.trim()};if(urls.length)payload.image_url=urls.join(',');const result=id?await supabaseClient.from('products').update(payload).eq('id',id):await supabaseClient.from('products').insert({...payload,published:false});if(result.error){$('save-msg').textContent='保存失败：'+result.error.message;return;}$('save-msg').textContent=id?'修改成功！':'商品已保存为草稿。';resetForm();await refresh();};window.togglePublished=async(id,published)=>{const {error}=await supabaseClient.from('products').update({published}).eq('id',id);if(error)alert('操作失败：'+error.message);else refresh();};window.deleteProduct=async id=>{if(!confirm('确定删除这个商品吗？'))return;const {error}=await supabaseClient.from('products').delete().eq('id',id);if(error)alert('删除失败：'+error.message);else refresh();};</script></body></html>
